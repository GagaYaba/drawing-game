name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality, performance and production gate
        run: npm run quality:check

      - name: Upload C.2.1.1 quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c2-1-1-quality-performance-report
          path: reports/c2-1-1/quality-performance-report.json
          if-no-files-found: warn
          retention-days: 14
